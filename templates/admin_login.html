<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - EnAsia</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(145deg, #2b0709 0%, #420c10 52%, #581318 100%);
            color: #231717;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }
        .login-box {
            background-color: #faf8f7;
            border: 1px solid #c9a227;
            border-top: 4px solid #c9a227;
            padding: 32px 28px;
            width: 100%;
            max-width: 390px;
            border-radius: 14px;
            text-align: left;
            box-shadow: 0 24px 60px rgba(20, 3, 5, 0.5);
        }
        .eyebrow {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #9a730c;
            margin: 0 0 4px 0;
            text-align: center;
        }
        h2 {
            color: #420c10;
            text-align: center;
            margin: 0 0 20px 0;
            font-size: 24px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 650;
            color: #3d2425;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            background: #fffdfb;
            border: 1px solid #d4c3be;
            color: #231717;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #68181f;
            box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.25);
        }
        button {
            background: linear-gradient(135deg, #420c10 0%, #68181f 100%);
            color: #fffdf9;
            border: 1px solid rgba(212, 175, 55, 0.55);
            padding: 11px;
            width: 100%;
            font-weight: 700;
            font-size: 14px;
            border-radius: 7px;
            cursor: pointer;
            margin-top: 4px;
        }
        button:hover {
            background: linear-gradient(135deg, #541015 0%, #7d1d26 100%);
            border-color: #e6c65a;
        }
        .error {
            color: #881b1b;
            background: #fae5e5;
            border: 1px solid #e2bcbc;
            padding: 10px;
            border-radius: 7px;
            font-weight: 600;
            text-align: center;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .back-link {
            margin-top: 18px;
            color: #e6c65a;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-box">
        <p class="eyebrow">EnAsia Transport</p>
        <h2>Admin Login</h2>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required>
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
    <a href="{{ url_for('home') }}" class="back-link">← Back to Home</a>
</body>
</html>
